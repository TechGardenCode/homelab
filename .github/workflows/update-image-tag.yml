name: update-image-tag

# The homelab writer: reconciles every app in ci/app-registry.yaml to the
# newest built commit on its repo's main (see ci/writer.sh). Dispatches are
# nudges only; the payload is logged and never used.

on:
  repository_dispatch:
    types: [update-image]
  push:
    branches: [main]
    paths:
      - ci/app-registry.yaml
      - ci/writer.sh
      - .github/workflows/update-image-tag.yml
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# One run at a time; a newer pending run replaces an older pending one,
# which is fine because every run reconciles all apps.
concurrency:
  group: homelab-writer
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: writer
    steps:
      - name: Log nudge
        if: github.event_name == 'repository_dispatch'
        env:
          APP: ${{ github.event.client_payload.app }}
        run: '[[ "$APP" =~ ^[a-z0-9-]+$ ]] && echo "nudge: $APP" || echo "nudge: (invalid app name ignored)"'

      - name: Mint writer token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.WRITER_APP_ID }}
          private-key: ${{ secrets.WRITER_APP_PRIVATE_KEY }}
          owner: TechGardenCode
          repositories: homelab,wiki,overwatch

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0

      - name: Check yq
        run: yq --version

      - name: Reconcile
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GHCR_TOKEN: ${{ github.token }}
          PROMOTE_GUARD: ruleset
          GIT_AUTHOR_NAME: techgarden-homelab-writer[bot]
          GIT_AUTHOR_EMAIL: 347152658+techgarden-homelab-writer[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: techgarden-homelab-writer[bot]
          GIT_COMMITTER_EMAIL: 347152658+techgarden-homelab-writer[bot]@users.noreply.github.com
        run: bash ci/writer_test.sh && bash ci/writer.sh

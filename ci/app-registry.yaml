---
# App registry: every app whose image tag the homelab writer manages.
#
# The writer (.github/workflows/update-image-tag.yml -> ci/writer.sh) does not
# replay dispatch payloads. Each run reconciles EVERY app here: it walks the
# app repo's main history newest-first, takes the first commit whose sha
# exists as a tag of the app's image, and writes that tag.
#   - env: dev paths are set on homelab main directly.
#   - env: prod paths go through one promote/<app> PR (Kian merges), or are
#     written on main too when the app sets prod: auto.
# Runs on update-image dispatches (a nudge only), on pushes that touch this
# file, every 30 minutes, and on demand.
#
# Schema (unknown keys fail the writer):
#   <app>:                 # ^[a-z0-9-]+$
#     repo: TechGardenCode/<repo>   # required; its main history decides "newest"
#     prod: pr | auto      # optional, default pr
#     paths:               # required, non-empty
#       - path: <helm values.yaml; image name comes from the first path's .image.repository>
#         env: dev | prod

apps:
  wiki:
    repo: TechGardenCode/wiki
    paths:
      - path: kubernetes/clusters/1276-dev/wiki/wiki/values.yaml
        env: dev
      - path: kubernetes/clusters/1276-prod/wiki/wiki/values.yaml
        env: prod

  kian-coffee:
    repo: TechGardenCode/kian.coffee
    paths:
      - path: kubernetes/clusters/1276-dev/kian-coffee/kian-coffee/values.yaml
        env: dev
      - path: kubernetes/clusters/1276-prod/kian-coffee/kian-coffee/values.yaml
        env: prod

  kian-coffee-blog:
    repo: TechGardenCode/kian-coffee-blog
    paths:
      - path: kubernetes/clusters/1276-dev/kian-coffee/kian-coffee-blog/values.yaml
        env: dev

  overwatch-api:
    repo: TechGardenCode/overwatch
    paths:
      - path: kubernetes/clusters/1276-dev/overwatch/overwatch-api/values.yaml
        env: dev
      - path: kubernetes/clusters/1276-core/overwatch/overwatch-api/values.yaml
        env: prod

  overwatch-web:
    repo: TechGardenCode/overwatch
    paths:
      - path: kubernetes/clusters/1276-dev/overwatch/overwatch-web/values.yaml
        env: dev
      - path: kubernetes/clusters/1276-core/overwatch/overwatch-web/values.yaml
        env: prod

  hausparty:
    repo: TechGardenCode/hausparty
    paths:
      - path: kubernetes/clusters/1276-dev/hausparty/hausparty/values.yaml
        env: dev
      - path: kubernetes/clusters/1276-prod/hausparty/hausparty/values.yaml
        env: prod

  lizard-www:
    repo: TechGardenCode/lizard
    prod: auto
    paths:
      - path: kubernetes/clusters/1276-prod/lizard/www/values.yaml
        env: prod

  garibaldo-www:
    repo: TechGardenCode/garibaldo
    prod: auto
    paths:
      - path: kubernetes/clusters/1276-prod/garibaldo/www/values.yaml
        env: prod

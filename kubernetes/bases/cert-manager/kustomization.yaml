# cert-manager — a base, not an app: it sits outside every ApplicationSet glob and
# each cluster pulls it in from clusters/<cluster>/cert-manager/cert-manager/, which adds its own
# ExternalSecret (the CMP passes only NAMESPACE, so shared/ can't carry a
# per-cluster Bitwarden secret id: dev reads the `dev` project, prod/core `infra`).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - base/cluster-issuer.yaml
  - base/bitwarden-issuer.yaml

helmCharts:
  - repo: https://charts.jetstack.io
    name: cert-manager
    version: v1.21.3
    includeCRDs: true
    releaseName: cert-manager
    valuesFile: values.yaml
    namespace: cert-manager

# otel-agent: one per node. Pod logs, kubeletstats, cadvisor.
mode: daemonset

presets:
  logsCollection:
    enabled: true
    storeCheckpoints: true  # hostPath /var/lib/otelcol, also holds the export queue
  kubernetesAttributes:
    enabled: true
  kubeletMetrics:
    enabled: true

# Root: reads /var/log/pods and writes the hostPath queue.
securityContext:
  runAsUser: 0
  runAsGroup: 0

tolerations:
  - operator: Exists

clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["nodes/metrics"]
      verbs: ["get"]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

config:
  processors:
    # Common identity plus the node: cadvisor and self-scrape metrics carry
    # no node otherwise (k8s_attributes can't associate them).
    resource:
      attributes:
        - { key: k8s.cluster.name, value: "${env:K8S_CLUSTER_NAME}", action: upsert }
        - { key: deployment.environment, value: "${env:DEPLOYMENT_ENVIRONMENT}", action: upsert }
        - { key: k8s.node.name, value: "${env:K8S_NODE_NAME}", action: upsert }
  receivers:
    kubeletstats:
      insecure_skip_verify: true
      metric_groups: [node, pod, container, volume]
    prometheus:
      config:
        scrape_configs:
          - job_name: otelcol-k8s-agent
            scrape_interval: 30s
            static_configs:
              - targets: ["${env:MY_POD_IP}:8888"]
          - job_name: cadvisor
            scrape_interval: 30s
            scheme: https
            metrics_path: /metrics/cadvisor
            authorization:
              credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            tls_config:
              insecure_skip_verify: true
            static_configs:
              - targets: ["${env:K8S_NODE_IP}:10250"]
            # ponytail: drop repeats, keep per-container signal (about 9M of
            # 18M rows/h estate-wide). Root and kubepods/pod cgroups repeat the
            # kubeletstats totals; hostNetwork pods each repeat the host NIC.
            # The Talos /system/* cgroups and the root's host NICs stay.
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: container_(spec_.*|last_seen|creation_time_seconds|memory_failures_total|blkio_device_usage_total)
                action: drop
              - source_labels: [container, id, __name__]
                regex: ";/(kubepods.*)?;container_(cpu|memory|fs|file|threads|sockets|processes|oom|pressure|ulimits|tasks|health|start|scrape|last|blkio)(_.*)?"
                action: drop
              - source_labels: [interface]
                regex: tunl0|sit0|ip6tnl0|teql0|dummy0|ip_vti0|ip6_vti0|gre0|gretap0|erspan0|ip6gre0
                action: drop
              - source_labels: [__name__, pod, interface]
                regex: "container_network_.*;.+;(bond.*|en.*|eth[1-9].*|cni.*|flannel.*|lo|veth.*)"
                action: drop

---
# Overwatch app state (alert rules, dashboards, saved queries, inbox). The app
# owns its schema via Flyway. Telemetry itself lives in ClickHouse, not here.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: overwatch-db
  namespace: overwatch
spec:
  # Primary + streaming standby (design: Postgres HA on core).
  instances: 2

  storage:
    size: 5Gi
    storageClass: freenas-iscsi-ssd-csi

  bootstrap:
    initdb:
      database: overwatch
      owner: overwatch
      secret:
        name: overwatch-db-app-credentials

  monitoring:
    # No Prometheus Operator on 1276-core; the otel-cluster collector scrapes :9187.
    enablePodMonitor: false
    disableDefaultQueries: false

  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 256Mi

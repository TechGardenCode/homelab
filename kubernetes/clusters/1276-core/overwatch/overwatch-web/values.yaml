image:
  repository: "ghcr.io/techgardencode/overwatch-web"
  tag: "c43fa0af6a2c757b7846ddee9389bc58ff062b31"
imagePullSecrets:
  - name: ghcr-credentials
ports:
  - name: main
    containerPort: 8080
service:
  type: ClusterIP
health:
  enabled: true
  startupProbeSeconds: 30
  port: main
  type: HTTP
  path: /healthz
replicas: 2
resources:
  requests:
    cpu: 5m
    memory: 16Mi
  limits:
    memory: 64Mi
# Auth: ../auth-gateway.
httpRoute:
  enabled: true
  hostname: overwatch.kian.sh
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

projects:
  1276-dev:
    namespace: argocd
    sourceRepos:
      - https://github.com/techgardencode/homelab.git
      # TechGarden app repo owns its own deploy manifests (web + iris).
      - https://github.com/TechGardenCode/techgarden.git
    destinations:
      - name: 1276-dev
        namespace: "*"
    clusterResourceWhitelist:
      - group: "*"
        kind: "*"
  1276-prod:
    namespace: argocd
    sourceRepos:
      - https://github.com/techgardencode/homelab.git
      # TechGarden app repo owns its own deploy manifests (api + web). Prod's copy
      # of the dev entry above — WS-02's internal flip (ADR-0060). Load-bearing with
      # the techgarden-prod ApplicationSet below: that set templates
      # `project: 1276-prod`, so without this repo listed here every generated
      # Application is rejected as an out-of-project source.
      - https://github.com/TechGardenCode/techgarden.git
    destinations:
      - name: 1276-prod
        namespace: "*"
    clusterResourceWhitelist:
      - group: "*"
        kind: "*"

applicationsets:
  1276-dev:
    name: 1276-dev
    namespace: argocd
    generators:
      - git:
          repoURL: https://github.com/techgardencode/homelab.git
          revision: main
          directories:
            - path: "kubernetes/clusters/shared/**/*"
            - path: "kubernetes/clusters/1276-dev/**/*"
    template:
      metadata:
        name: "1276-dev.{{path[3]}}.{{path.basenameNormalized}}"
      spec:
        project: "1276-dev"
        source:
          repoURL: https://github.com/techgardencode/homelab.git
          targetRevision: main
          path: "{{path}}"
          plugin:
            name: kustomize-helm
            parameters:
              - name: NAMESPACE
                string: "{{path[3]}}"
        destination:
          name: "1276-dev"
          namespace: "{{path[3]}}"
        syncPolicy:
          automated:
            selfHeal: true
            prune: true
          syncOptions:
            - ApplyOutOfSyncOnly=true
            - ServerSideApply=true
  # TechGarden monorepo deploy: this ApplicationSet points ArgoCD at the *app
  # repo's* own Kustomize overlays (web + iris), one Application per product.
  # Native kustomize (no kustomize-helm plugin) — the overlays are plain
  # kustomize, and the plugin's NAMESPACE param would clobber the per-product
  # namespaces each product ships in its own namespace.yaml.
  # NOTE: the techgarden repo must be reachable by ArgoCD (add repo creds if private).
  techgarden-dev:
    name: techgarden-dev
    namespace: argocd
    generators:
      - git:
          repoURL: https://github.com/TechGardenCode/techgarden.git
          revision: main
          directories:
            - path: "projects/*/deploy/overlays/dev"
    template:
      metadata:
        name: "1276-dev.techgarden-{{path[1]}}"
      spec:
        project: "1276-dev"
        source:
          repoURL: https://github.com/TechGardenCode/techgarden.git
          targetRevision: main
          path: "{{path}}"
        destination:
          name: "1276-dev"
          # Each product ships its own namespace (techgarden-web, iris) via a
          # namespace.yaml; this default only covers unnamespaced resources.
          namespace: "{{path[1]}}"
        syncPolicy:
          automated:
            selfHeal: true
            prune: true
          syncOptions:
            - ApplyOutOfSyncOnly=true
            - ServerSideApply=true
  1276-prod:
    name: 1276-prod
    namespace: argocd
    generators:
      - git:
          repoURL: https://github.com/techgardencode/homelab.git
          revision: main
          directories:
            - path: "kubernetes/clusters/shared/**/*"
            - path: "kubernetes/clusters/1276-prod/**/*"
    template:
      metadata:
        name: "1276-prod.{{path[3]}}.{{path.basenameNormalized}}"
      spec:
        project: "1276-prod"
        source:
          repoURL: https://github.com/techgardencode/homelab.git
          targetRevision: main
          path: "{{path}}"
          plugin:
            name: kustomize-helm
            parameters:
              - name: NAMESPACE
                string: "{{path[3]}}"
        destination:
          name: "1276-prod"
          namespace: "{{path[3]}}"
        syncPolicy:
          automated:
            selfHeal: true
            prune: true
          syncOptions:
            - ApplyOutOfSyncOnly=true
            - ServerSideApply=true
  # Prod twin of techgarden-dev above — WS-02's internal flip (ADR-0060). Deliberately
  # byte-identical to it with dev -> prod, so the two stay diffable by eye.
  #
  # This makes prod RUN AND SERVE, IN-CLUSTER ONLY. It reaches nothing publicly: the web
  # prod overlay keeps base's `eg-internal` parentRef and adds no `dns.kian.sh/provider`
  # annotation, so no route lands on eg-public and no record is created. The public flip
  # is a separate, additive act — a second HTTPRoute — never a retarget of this one.
  #
  # `project: 1276-prod` is load-bearing: with `default` the AppProject sourceRepos entry
  # above is inert and the Applications would sync anyway, silently ungated.
  techgarden-prod:
    name: techgarden-prod
    namespace: argocd
    generators:
      - git:
          repoURL: https://github.com/TechGardenCode/techgarden.git
          revision: main
          directories:
            - path: "projects/*/deploy/overlays/prod"
    template:
      metadata:
        name: "1276-prod.techgarden-{{path[1]}}"
      spec:
        project: "1276-prod"
        source:
          repoURL: https://github.com/TechGardenCode/techgarden.git
          targetRevision: main
          path: "{{path}}"
        destination:
          name: "1276-prod"
          # Each product ships its own namespace (api, techgarden-web) via a
          # namespace.yaml; this default only covers unnamespaced resources.
          namespace: "{{path[1]}}"
        syncPolicy:
          automated:
            selfHeal: true
            prune: true
          syncOptions:
            - ApplyOutOfSyncOnly=true
            - ServerSideApply=true
  1276-core:
    name: 1276-core
    generators:
      - git:
          repoURL: https://github.com/techgardencode/homelab.git
          revision: main
          directories:
            # - path: "kubernetes/clusters/1276-core/**/*"
            #   exclude: true
            - path: "kubernetes/clusters/shared/**/*"
            - path: "kubernetes/clusters/1276-core/argocd/*"
            - path: "kubernetes/clusters/1276-core/metallb-system/*"
            - path: "kubernetes/clusters/1276-core/envoy-gateway-system/*"
            - path: "kubernetes/clusters/1276-core/storage/*"
            - path: "kubernetes/clusters/1276-core/pki/*"
            - path: "kubernetes/clusters/1276-core/cluster-ops/*"
            - path: "kubernetes/clusters/1276-core/platform/*"
            - path: "kubernetes/clusters/1276-core/observability/*"
    template:
      metadata:
        name: "1276-core.{{path[3]}}.{{path.basenameNormalized}}"
      spec:
        project: default
        source:
          repoURL: https://github.com/techgardencode/homelab.git
          targetRevision: main
          path: "{{path}}"
          plugin:
            name: kustomize-helm
            parameters:
              - name: NAMESPACE
                string: "{{path[3]}}"
        destination:
          name: in-cluster
          namespace: "{{path[3]}}"
        syncPolicy:
          automated:
            selfHeal: true
            prune: true
          syncOptions:
            - ApplyOutOfSyncOnly=true
            - ServerSideApply=true

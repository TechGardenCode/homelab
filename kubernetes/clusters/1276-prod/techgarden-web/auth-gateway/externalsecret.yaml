---
# OIDC confidential client secret for the Envoy Gateway `techgarden-gateway`
# client, synced from the same BWS item config-cli uses to set it in Keycloak.
# EG reads the client secret from the key "client-secret" (OIDCClientSecretKey).
#
# PASSWORD PARITY, NOT DUPLICATION: this is the SAME BWS entry
# (`prod-keycloak-techgarden-gateway`) that keycloak/base/externalsecret-realm.yaml
# reads as `techgarden-gateway-client-secret` to SET the secret in the realm. One
# entry, read from two places — never two entries kept in step by hand. If the pair
# ever drifts, the gateway authenticates with a client secret Keycloak does not
# have and every login fails. Dev implements the identical pattern (58eeaf5d…).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: techgarden-gateway-oidc
  namespace: techgarden-web
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: techgarden-gateway-oidc
  data:
    - secretKey: client-secret
      remoteRef:
        # BWS `prod-keycloak-techgarden-gateway` — same UUID as the realm side.
        key: "452e89e3-7083-4eea-a076-b49e00b4df76"

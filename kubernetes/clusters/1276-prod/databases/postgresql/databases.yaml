---
# Consolidated `techgarden` database on the shared `postgresql` cluster
# (ADR-0030/0031, schema-per-module) — the single backend DB for all five modules.
#
# Adopts the `techgarden` DB created by the cluster bootstrap (initdb),
# reassigning its owner from the bootstrap `techgardencode` to the managed
# `techgarden_app` role.
#
# databaseReclaimPolicy: retain => deleting this CR never drops the live database.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: techgarden-database
  namespace: databases
spec:
  name: techgarden
  owner: techgarden_app
  cluster:
    name: postgresql
  databaseReclaimPolicy: retain

---
# Cluster-level credentials for the shared prod `postgresql` cnpg cluster.
# Both entries live in the BWS `homelab` project; the VALUE is the bare password
# and the username is templated here (never stored in Bitwarden).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-superuser
  namespace: databases
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: postgresql-superuser
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: postgres
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        # BWS `prod-db-superuser`
        key: "509caf90-2534-48cc-9f57-b49e00b4c32b"
---
# Bootstrap (initdb) owner. cnpg creates the `techgarden` database owned by this
# role; databases.yaml then reassigns ownership to the managed `techgarden_app`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-app-credentials
  namespace: databases
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: postgresql-app-credentials
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: techgardencode
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        # BWS `prod-db-initdb-owner`
        key: "bc38dc54-d611-463e-ab51-b49e00b4cdca"

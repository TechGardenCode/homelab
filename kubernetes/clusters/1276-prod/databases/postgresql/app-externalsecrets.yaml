---
# Consolidated app-role password (ADR-0030/0031) for `techgarden_app`, materialised
# into the `databases` namespace so `managed.roles.passwordSecret` (cluster.yaml) can
# set it. cnpg managed roles require ALL THREE of: type kubernetes.io/basic-auth,
# keys username/password, and the cnpg.io/reload label — drop any one and the role
# is created without the password ever being applied.
#
# PASSWORD PARITY, NOT DUPLICATION: at the flip, the app repo's `api-db-app`
# ExternalSecret in the `api` namespace reads THIS SAME BWS entry
# (ec8e0074…). One entry read twice — never two entries kept in step by hand.
# If they ever drift, the API authenticates with a credential the database does
# not have. Dev implements the identical pattern with a single UUID (6389718c…).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: techgarden-db-app-credentials
  namespace: databases
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: techgarden-db-app-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: techgarden_app
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        # BWS `prod-db-techgarden-app`
        key: "ec8e0074-9107-49ef-8260-b49e00b4d72a"

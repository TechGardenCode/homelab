apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: keycloak

resources:
  # Official Keycloak Operator @ 26.6.3 (CRDs + operator Deployment/RBAC),
  # vendored from keycloak/keycloak-k8s-resources. CRDs apply under the
  # ApplicationSet's ServerSideApply=true (the Keycloak CRD exceeds the
  # client-side annotation limit).
  - base/operator/crd-keycloaks.yaml
  - base/operator/crd-keycloakrealmimports.yaml
  - base/operator/operator.yaml
  - base/keycloak-cr.yaml
  - base/externalsecret.yaml
  - base/externalsecret-realm.yaml
  - base/httproute.yaml
  - base/httproute-internal.yaml
  - base/config-cli-job.yaml

configMapGenerator:
  # ── THE GO SWITCH ───────────────────────────────────────────────────────────
  # base/realms/techgarden-realm.json EXISTS IN THIS REPO BUT IS DELIBERATELY NOT
  # LISTED HERE (WS-02, techgarden ADR-0060). This list is the only thing that
  # decides whether the prod techgarden realm exists at all: config-cli imports
  # /config/*.json from this ConfigMap, so an unlisted file is never seen by
  # Keycloak. While it stays unlisted, https://sso.techgarden.gg/realms/techgarden
  # returns 404 — and that 404 is the PASS CONDITION for this phase, not a bug.
  #
  # THE FLIP IS EXACTLY ONE LINE: add `- base/realms/techgarden-realm.json` below.
  # Everything it depends on is already wired by this PR — both KC_* substitution
  # vars are on the Job and both secret keys are on the ExternalSecret — so the
  # flip needs no other change in this directory.
  - name: keycloak-realm-config
    namespace: keycloak
    files:
      - base/realms/accounts-realm.json
      - base/realms/hausparty-realm.json
      - base/realms/kian-coffee-realm.json

  # WS-05 TechGarden theme (base/themes/techgarden/), mounted into the Keycloak
  # pod by spec.unsupported.podTemplate in base/keycloak-cr.yaml. Mounted now,
  # unreferenced until the realm above is enabled — a theme nothing points at is
  # inert, so this carries no risk to the three live realms.
  #
  # SPLIT login/email deliberately: configMapGenerator keys off the file's BASE
  # name and ConfigMap keys cannot contain "/", so a single ConfigMap collides —
  # `theme.properties` and `messages_en.properties` each exist under both login/
  # and email/. One ConfigMap per theme type removes the collision without
  # renaming keys; the volume's items[].path then rebuilds the subdirectories.
  #
  # woff2/ico/png land in binaryData automatically. Serialized payload is ~333 KB
  # (265 KB raw; the 203 KB of binaries base64 to 271 KB) against the 1 MiB cap.
  - name: keycloak-theme-techgarden-login
    namespace: keycloak
    files:
      - base/themes/techgarden/login/theme.properties
      - base/themes/techgarden/login/messages/messages_en.properties
      - base/themes/techgarden/login/resources/css/login.css
      - base/themes/techgarden/login/resources/fonts/OFL-bricolage-grotesque.txt
      - base/themes/techgarden/login/resources/fonts/OFL-hanken-grotesk.txt
      - base/themes/techgarden/login/resources/fonts/bricolage-grotesque-latin-ext.woff2
      - base/themes/techgarden/login/resources/fonts/bricolage-grotesque-latin.woff2
      - base/themes/techgarden/login/resources/fonts/hanken-grotesk-latin-ext.woff2
      - base/themes/techgarden/login/resources/fonts/hanken-grotesk-latin.woff2
      - base/themes/techgarden/login/resources/img/favicon.ico
      - base/themes/techgarden/login/resources/img/logo.png

  - name: keycloak-theme-techgarden-email
    namespace: keycloak
    files:
      - base/themes/techgarden/email/theme.properties
      - base/themes/techgarden/email/messages/messages_en.properties
      - base/themes/techgarden/email/html/email-verification.ftl
      - base/themes/techgarden/email/html/executeActions.ftl
      - base/themes/techgarden/email/html/password-reset.ftl
      - base/themes/techgarden/email/html/template.ftl

generatorOptions:
  # Stable names: keycloak-config-cli mounts keycloak-realm-config by fixed name.
  # The theme ConfigMaps inherit this, so a theme edit does NOT roll the pod on
  # its own — bump theme-revision in base/keycloak-cr.yaml. See the note there.
  disableNameSuffixHash: true

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-realm-secrets
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: keycloak-realm-secrets
  data:
    - secretKey: hausparty-client-secret
      remoteRef:
        key: "7efc9f22-9adb-4d03-86cb-b4240013d5d9"
    # techgarden realm — Envoy Gateway OIDC confidential client (WS-03 auth session).
    #
    # PASSWORD PARITY, NOT DUPLICATION: at the flip the SAME BWS entry is read a
    # second time by `techgarden-gateway-oidc` in the `techgarden-web` namespace.
    # One entry read twice — never two entries kept in step by hand. If the pair
    # ever drifts, the gateway authenticates with a client secret Keycloak does
    # not have. Dev implements the identical pattern with a single UUID
    # (58eeaf5d…).
    - secretKey: techgarden-gateway-client-secret
      remoteRef:
        # BWS `prod-keycloak-techgarden-gateway`
        key: "452e89e3-7083-4eea-a076-b49e00b4df76"
    # techgarden realm — Resend SMTP relay password (= Resend API key). SMTP
    # username is the literal string "resend"; sending domain mail.techgarden.gg.
    #
    # SHARED WITH DEV, DELIBERATELY. Resend's free tier allows exactly ONE verified
    # sending domain, and there is exactly one `resend` entry in the whole BWS org
    # (no prod-specific SMTP secret exists). So prod and dev send as the same
    # domain and SHARE the 3,000/month · 100/day allowance — meaning ADR-0052's
    # fail-closed-on-429 behaviour is a property the two environments share, and
    # dev traffic can exhaust prod's quota. Splitting them requires a paid Resend
    # plan and a second verified domain.
    - secretKey: smtp-password
      remoteRef:
        # BWS `resend` — same entry dev reads
        key: "7f9f15f5-b70f-4b5a-b3b4-b4990025593b"
    # accounts realm — broker client secrets (per-env)
    - secretKey: broker-hausparty-secret
      remoteRef:
        key: "e1d24a90-3615-4001-b203-b4420013a372"
    - secretKey: broker-kian-coffee-secret
      remoteRef:
        key: "0f6048e9-a211-4d20-9909-b4420013a42b"
    - secretKey: broker-master-secret
      remoteRef:
        key: "d8656e40-065d-4659-b20f-b4420013a491"

# TechGarden login copy (WS-05).
#
# Only the keys a friend actually READS across the six live surfaces are overridden.
# Everything else falls through to base. This is not a translation of Keycloak's
# ~400 keys and must not become one. In particular, a key whose base value is already
# right is NOT restated here: pinning it would silently freeze it against a Keycloak
# upgrade that improves the wording.
#
# Voice rules are design-system/README.md > CONTENT FUNDAMENTALS, and they are the
# reason this file exists at all: sentence case and "no terminal period" live in the
# message bundle, not in CSS -- text-transform cannot sentence-case a string.
#
#   - Sentence case everywhere. No Title Case, no ALL CAPS.
#   - No terminal period on standalone UI copy (labels, buttons, hints, one-line
#     errors). Periods only BETWEEN sentences in multi-sentence copy.
#   - No emoji. Straight ASCII apostrophes, never curly.
#   - Calm and unhurried, never scolding and never breathless.
#   - "TechGarden" is one word and a proper noun.
#
# .properties is ISO-8859-1 by spec; keep this file ASCII-only so nothing has to be
# \u-escaped.
#
# APOSTROPHES: ' is MessageFormat's quote character and must be DOUBLED ('') anywhere
# in this file -- placeholder or not. Keycloak runs MessageFormat on EVERY msg() call
# regardless of arity (MessageFormatterMethod has no zero-arg branch), so a lone '
# opens a quoted literal that never closes and is silently swallowed: "I'll send you
# a link" renders as "Ill send you a link". Stock base/ doubles them the same way
# (notMatchPasswordMessage=Passwords don''t match.).

# -- Brand lockup ------------------------------------------------------------
# base/login/template.ftl renders this inside #kc-header-wrapper, through
# kcSanitize(...)?no_esc. The mark itself is drawn by CSS (.tg-login__brand::before)
# because a message cannot interpolate ${url.resourcesPath}. {0} would be the realm's
# displayNameHtml; we ignore it so the lockup does not depend on realm config.
loginTitleHtml=<span class="tg-brand__name">TechGarden</span>

# -- Sign in -----------------------------------------------------------------
loginAccountTitle=Sign in
doLogIn=Sign in
doForgotPassword=Forgot your password?
rememberMe=Keep me signed in
showPassword=Show password
hidePassword=Hide password

# -- Reset password ----------------------------------------------------------
emailForgotTitle=Reset your password
emailInstruction=Enter your username or email and I''ll send you a link to set a new password
# doSubmit is a GENERIC key: base/login/login-reset-password.ftl AND
# base/login/login-update-password.ftl both render their primary button from it. It
# was briefly "Send the link", which is right for the reset request and nonsense on
# the set-a-new-password page, where it read "Send the link" above two password
# fields. Anything set here has to read correctly on BOTH -- override the template
# instead if a page ever genuinely needs its own verb.
doSubmit=Continue
backToLogin=Back to sign in
# Shown as a success alert back on the SIGN-IN page, not on a page of its own --
# Keycloak returns the same response whether or not the account exists, which is its
# anti-enumeration behaviour. The wording must therefore not confirm that the account
# exists; "if that account exists" states that honestly rather than implying it.
# (Found live during Stage-3 validation: stock reads "You should receive an email
# shortly with further instructions." -- Title-ish, and a terminal period on a
# single-sentence message.)
emailSentMessage=If that account exists, I''ve sent a link to set a new password

# -- Set a new password ------------------------------------------------------
# login-update-password.ftl serves BOTH the emailed reset link and the
# UPDATE_PASSWORD required action used when an account is created by hand, so this
# copy has to read correctly for a brand-new account as well as a reset.
updatePasswordTitle=Choose a password
passwordNew=New password
passwordConfirm=Confirm password
# Rendered as a checkbox on this page by base/login/password-commons.ftl.
logoutOtherSessions=Sign out from my other devices

# -- Verify email ------------------------------------------------------------
emailVerifyTitle=Verify your email
emailVerifyInstruction1=I''ve sent a link to {0}. Open it to confirm this address is yours.
emailVerifyInstruction2=Nothing arrived yet?
emailVerifyInstruction3=to send it again.
# The app-initiated path falls to this one instead of Instruction1 (when verifyEmail??
# is false), so it needs the same voice or the surface reads half-branded.
emailVerifyInstruction4=I''m about to send a link to {0} so you can confirm this address is yours.

# -- Errors ------------------------------------------------------------------
# Calm, concrete, and never blaming the person reading it.
errorTitle=Something went wrong
pageExpiredTitle=This page expired
# base/login/login-page-expired.ftl hardcodes "<a>...</a> ." after each of these -- a
# literal space then a period -- so they must NOT end in punctuation of their own or
# the sentence lands as "..., Click here .". Stock reads the same way; wording them
# without the comma is the only fix that avoids overriding the template.
pageExpiredMsg1=To start again
pageExpiredMsg2=To carry on signing in
invalidUserMessage=That username or password did not match
invalidUsernameMessage=That username did not match
invalidUsernameOrEmailMessage=That username or email did not match
invalidPasswordMessage=That password did not match
# DELIBERATELY identical to invalidUserMessage, exactly as stock 26.6.3 has it. The
# duplication is an anti-enumeration measure: a distinct "this account is locked"
# message confirms to an attacker that the username exists. A friendlier, more
# specific string was written here and reverted -- being kind about a lockout is not
# worth handing out an account-existence oracle on the login page.
accountTemporarilyDisabledMessage=That username or password did not match
accountDisabledMessage=This account is disabled. Get in touch if that is unexpected.
expiredCodeMessage=That link has expired. Start again to get a fresh one.
expiredActionMessage=That link has expired. Please sign in again.
missingUsernameMessage=Enter your username
missingPasswordMessage=Enter your password
missingEmailMessage=Enter your email
notMatchPasswordMessage=Those passwords did not match
invalidPasswordMinLengthMessage=Passwords need at least {0} characters
invalidEmailMessage=That does not look like an email address

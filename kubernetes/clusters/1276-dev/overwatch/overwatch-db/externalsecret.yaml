---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: overwatch-db-app-credentials
  namespace: overwatch
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: overwatch-db-app-credentials
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: overwatch
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: "c4260343-5a6e-4e6e-aa11-b4ec01126f62"

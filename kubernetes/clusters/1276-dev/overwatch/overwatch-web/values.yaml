image:
  repository: "ghcr.io/techgardencode/overwatch-web"
  tag: "da0bf7c1982982226b3c7b466b9aca1e1ec7779b"
imagePullSecrets:
  - name: ghcr-credentials
ports:
  - name: main
    containerPort: 8080
service:
  type: ClusterIP
health:
  enabled: true
  startupProbeSeconds: 30
  port: main
  type: HTTP
  path: /healthz
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi
# Auth: ../auth-gateway.
httpRoute:
  enabled: true
  hostname: overwatch.dev.kian.sh
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

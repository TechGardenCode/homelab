---
# Client secret for the Keycloak `overwatch-gateway` client (accounts realm), from
# the same BWS item config-cli sets in Keycloak. EG reads key "client-secret".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: overwatch-gateway-oidc
  namespace: overwatch
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: overwatch-gateway-oidc
  data:
    - secretKey: client-secret
      remoteRef:
        key: "31239cc1-7b89-4c72-a6dc-b4ec01126fc5"

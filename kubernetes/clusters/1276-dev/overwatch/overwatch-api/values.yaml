image:
  repository: "ghcr.io/techgardencode/overwatch-api"
  tag: "4fda2c7fe7e2d394c7a3c65836c7165909886ac9"
imagePullSecrets: # ghcr-credentials ExternalSecret lives in ../overwatch-web
  - name: ghcr-credentials
ports:
  - name: main
    containerPort: 8080
service:
  type: ClusterIP
health:
  enabled: true
  startupProbeSeconds: 120
  port: main
  type: HTTP
  path: /actuator/health
resources:
  requests:
    cpu: 50m
    memory: 384Mi
  limits:
    memory: 512Mi
envs:
  - OVERWATCH_ISSUER_URI: "https://sso.dev.techgarden.gg/realms/accounts"
  - SPRING_DATASOURCE_URL: "jdbc:postgresql://overwatch-db-rw.overwatch.svc:5432/overwatch"
  - SPRING_DATASOURCE_USERNAME: "overwatch"
  - OVERWATCH_CLICKHOUSE_URL: "http://10.0.60.162:8123"
  - OVERWATCH_CLICKHOUSE_USER: "overwatch_dev_ro"
  - OVERWATCH_CLICKHOUSE_DATABASE: "otel_dev"
secretEnvs:
  - SPRING_DATASOURCE_PASSWORD: "pg-password"
  - OVERWATCH_CLICKHOUSE_PASSWORD: "clickhouse-password"
# Same host as overwatch-web; the longer /api prefix wins. Auth: ../auth-gateway.
httpRoute:
  enabled: true
  hostname: overwatch.dev.kian.sh
  path: /api
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

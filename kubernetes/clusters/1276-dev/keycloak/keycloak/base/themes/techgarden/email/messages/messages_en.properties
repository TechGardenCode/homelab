# TechGarden email copy (WS-05).
#
# Voice rules are design-system/README.md > CONTENT FUNDAMENTALS; see the login
# theme's messages_en.properties for the full list. Email is longer-form than UI
# copy, so sentences here DO take terminal periods -- the "no terminal period" rule
# governs standalone labels and buttons, not prose. Button labels below still follow
# it.
#
# The realm name placeholder ({2} in the reset/verify bodies) is deliberately NOT
# used. It renders the realm's technical id -- `techgarden`, lowercase -- unless a
# displayName is set, and the brand rule is that the PRODUCT capitalises while the
# lowercase form is reserved for identifiers. Writing "TechGarden" literally makes
# the copy correct regardless of realm config.
#
# MessageFormat: ' is the quote character, so it must be doubled ('') in any string
# that also contains a {n} placeholder or the placeholder stops substituting. This
# file is ASCII-only so nothing needs \u-escaping.
#
# NOTE ON EXPIRY: "{0}" in the *Footer strings is the formatted link lifespan, which
# comes from the realm's action-token lifespan -- it is NOT hardcoded here. Stock
# Keycloak reads "This link will expire within 3 days"; the wording below is ours,
# the duration stays whatever the realm is configured for.

# -- Password reset ----------------------------------------------------------
passwordResetSubject=Reset your TechGarden password
passwordResetButton=Set a new password
passwordResetBodyHtml=<p style="margin:0 0 16px;">Someone asked to reset the password for your TechGarden account. If that was you, use the button below to set a new one.</p>
passwordResetFooterHtml=<p style="margin:24px 0 0; font-size:13px; color:#6e6557;">This link expires in {0}. If you did not ask for this, you can ignore this email and nothing will change.</p>
passwordResetBody=Someone asked to reset the password for your TechGarden account. If that was you, open the link below to set a new one.\n\n{0}\n\nThis link expires in {3}. If you did not ask for this, you can ignore this email and nothing will change.

# -- Verify email ------------------------------------------------------------
emailVerificationSubject=Confirm your email for TechGarden
emailVerificationButton=Confirm my email
emailVerificationBodyHtml=<p style="margin:0 0 16px;">Please confirm this is your email address for your TechGarden account.</p>
emailVerificationFooterHtml=<p style="margin:24px 0 0; font-size:13px; color:#6e6557;">This link expires in {0}. If you were not expecting this, you can ignore this email.</p>
emailVerificationBody=Please confirm this is your email address for your TechGarden account by opening the link below.\n\n{0}\n\nThis link expires in {3}. If you were not expecting this, you can ignore this email.

# -- Account invite (execute-actions-email) ----------------------------------
# Per ADR-0052 there is no self-service signup, so this is the first email a friend
# ever receives. It must read as a welcome, not as a security alert -- and it must
# never imply a password was created for them and sent separately, because none is.
executeActionsSubject=Your TechGarden account is ready
executeActionsButton=Set up my account
executeActionsBodyHtml=<p style="margin:0 0 16px;">An account has been created for you on TechGarden. Use the button below to choose your password and finish setting it up.</p>
executeActionsFooterHtml=<p style="margin:24px 0 0; font-size:13px; color:#6e6557;">This link expires in {0}. If it has already expired, ask for a new one and I will send another.</p>
executeActionsBody=An account has been created for you on TechGarden. Open the link below to choose your password and finish setting it up.\n\n{0}\n\nThis link expires in {4}. If it has already expired, ask for a new one and I will send another.

# TechGarden login theme (WS-05).
#
# parent=base, NOT parent=keycloak. At Keycloak 26.6.3 the stock `keycloak` theme
# contains zero .ftl files -- every template lives in `base` -- and `keycloak` adds
# only PatternFly CSS. Inheriting `base` therefore gives us every template with no
# stylesheet to fight. `styles=` REPLACES the parent's list rather than appending,
# so the one line below is the complete stylesheet set.
#
# We override NO .ftl in this theme. Every surface is styled through the kc*Class
# bindings below plus login.css, which means a Keycloak upgrade that changes template
# markup cannot leave us rendering a stale copy of it.
#
# Source of truth for every value in login.css is the app repo's design-system/.
# See the "Downstream consumers" note in design-system/README.md before changing
# a semantic color, the type scale, or a font file.

parent=base
styles=css/login.css

meta=viewport==width=device-width,initial-scale=1

# ── Page shell ────────────────────────────────────────────────────────────────
kcHtmlClass=tg-login-html
kcBodyClass=tg-login-body
kcLoginClass=tg-login
kcHeaderClass=tg-login__header
kcHeaderWrapperClass=tg-login__brand
kcFormCardClass=tg-card tg-login__card
kcFormHeaderClass=tg-login__card-header
kcContentWrapperClass=tg-login__content-wrapper
kcLabelWrapperClass=tg-login__label-wrapper

# ── Form ──────────────────────────────────────────────────────────────────────
kcFormGroupClass=tg-field
kcLabelClass=tg-field__label
kcInputClass=tg-input
kcInputGroup=tg-input-wrap
kcInputErrorMessageClass=tg-field__error
kcFormSettingClass=tg-login__settings
kcFormOptionsWrapperClass=tg-login__options

# ── Buttons ───────────────────────────────────────────────────────────────────
# base/login/login.ftl stacks these four on one <input type="submit">.
kcButtonClass=tg-btn
kcButtonPrimaryClass=tg-btn--primary
kcButtonDefaultClass=tg-btn--secondary
kcButtonBlockClass=tg-btn--full
kcButtonLargeClass=tg-btn--lg

# ── Password visibility toggle ────────────────────────────────────────────────
# base/login/resources/js/passwordVisibility.js swaps the <i>'s class between the
# Show and Hide values below, so they must be two DIFFERENT class names or the icon
# never changes. They are drawn as CSS background images -- no icon font, which is
# what keeps this page free of external requests.
kcFormPasswordVisibilityButtonClass=tg-password-toggle
kcFormPasswordVisibilityIconShow=tg-icon-eye
kcFormPasswordVisibilityIconHide=tg-icon-eye-off

# ── Alerts / feedback ─────────────────────────────────────────────────────────
kcAlertClass=tg-alert
kcAlertTitleClass=tg-alert__title
# Stock values here are Font Awesome / PatternFly icon-font classes. We ship no icon
# font, so they are bound to CSS-drawn marks instead; leaving them unset renders an
# empty <span> that still occupies layout.
kcFeedbackErrorIcon=tg-alert__icon tg-alert__icon--error
kcFeedbackWarningIcon=tg-alert__icon tg-alert__icon--warning
kcFeedbackSuccessIcon=tg-alert__icon tg-alert__icon--success
kcFeedbackInfoIcon=tg-alert__icon tg-alert__icon--info
kcResetFlowIcon=tg-icon-back

# ── Info / footer area ────────────────────────────────────────────────────────
kcSignUpClass=tg-login__info
kcInfoAreaWrapperClass=tg-login__info-wrapper

# ── Locale switcher ───────────────────────────────────────────────────────────
# The realm is not internationalised today, so this block renders only if that
# changes. Bound anyway so it degrades to something styled rather than unstyled.
kcLocaleMainClass=tg-locale
kcLocaleWrapperClass=tg-locale__wrapper
kcLocaleDropDownClass=tg-locale__dropdown
kcLocaleListClass=tg-locale__list
kcLocaleListItemClass=tg-locale__item
kcLocaleItemClass=tg-locale__link

# TechGarden email theme (WS-05).
#
# parent=base, so every email template is inherited and only html/template.ftl --
# the shared layout macro every html/*.ftl imports -- is overridden. That single
# override brands password-reset, email-verification AND executeActions (the
# hand-provisioning invite WS-04 sends via execute-actions-email), which is the
# whole reason to override the macro rather than the individual templates.
#
# text/*.ftl are NOT overridden. Keycloak renders BOTH html/ and text/ for every
# email and throws if either is missing; the plain-text half needs no branding, so
# inheriting base and rewriting only the message strings is enough.
#
# No `styles=` here: email themes have no stylesheet mechanism. Mail clients strip
# <link>, most strip <style>, and none load webfonts -- so the layout below is
# table-based with inline styles and a system font stack. The login page's
# Bricolage/Hanken faces deliberately do not appear here; this is brand-ADJACENT
# (color, voice, structure), not pixel-identical to the login page.

parent=base

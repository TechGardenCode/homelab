# homelab login theme: the overwatch design kit (overwatch/kit/) applied to Keycloak's base templates.
#
# Same shape as ../techgarden: parent=base (every .ftl, no PatternFly to fight), NO .ftl overrides,
# only kc*Class bindings + stylesheets. css/kit.css (+ css/fonts/) is a VERBATIM copy of the kit;
# update by re-copying, never edit it here. css/login.css holds only page layout and the few raw
# Keycloak selectors the bindings can't reach.

parent=base
styles=css/kit.css css/login.css

meta=viewport==width=device-width,initial-scale=1

# ── Page shell ──
kcHtmlClass=hl-html
kcBodyClass=hl-body
kcLoginClass=hl-login
kcHeaderClass=hl-header
kcHeaderWrapperClass=hl-brand
kcFormCardClass=k-card hl-card
kcFormHeaderClass=hl-card-header
kcContentWrapperClass=hl-content
kcLabelWrapperClass=hl-label-wrap

# ── Form ──
kcFormGroupClass=hl-field
kcLabelClass=hl-label
kcInputClass=k-input hl-input
kcInputGroup=hl-input-group
kcInputErrorMessageClass=k-status-text k-crit hl-error
kcFormSettingClass=hl-settings
kcFormOptionsWrapperClass=hl-options

# ── Buttons ──
kcButtonClass=k-btn
kcButtonPrimaryClass=k-btn-primary
kcButtonDefaultClass=
kcButtonBlockClass=hl-block
kcButtonLargeClass=hl-lg
kcFormPasswordVisibilityButtonClass=k-btn hl-eye
kcFormPasswordVisibilityIconShow=hl-icon hl-icon-eye
kcFormPasswordVisibilityIconHide=hl-icon hl-icon-eye-off

# ── Alerts (the type comes from base's alert-{error,warning,success,info} class) ──
kcAlertClass=hl-alert
kcAlertTitleClass=hl-alert-title
kcFeedbackErrorIcon=hl-alert-icon
kcFeedbackWarningIcon=hl-alert-icon
kcFeedbackSuccessIcon=hl-alert-icon
kcFeedbackInfoIcon=hl-alert-icon
kcResetFlowIcon=hl-icon hl-icon-back

# ── Info area / locale (single locale, kept quiet) ──
kcSignUpClass=hl-info
kcInfoAreaWrapperClass=hl-info-wrap
kcLocaleMainClass=hl-locale

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-realm-secrets
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: keycloak-realm-secrets
  data:
    - secretKey: hausparty-client-secret
      remoteRef:
        key: "dfc135ab-56bd-42e6-83a8-b4230112ea1e"
    # techgarden realm — Envoy Gateway OIDC confidential client (WS-03 auth session)
    - secretKey: techgarden-gateway-client-secret
      remoteRef:
        key: "58eeaf5d-3f13-41ef-a869-b49201046fdd"
    # techgarden realm — Resend SMTP relay password (= Resend API key). Sending
    # domain mail.techgarden.gg; SMTP username is the literal string "resend".
    - secretKey: smtp-password
      remoteRef:
        key: "7f9f15f5-b70f-4b5a-b3b4-b4990025593b"
    # accounts realm — broker client secrets (BWS items in `homelab` project, prefix `keycloak-accounts-`)
    - secretKey: broker-hausparty-secret
      remoteRef:
        key: "66b0a67c-a9dc-4782-81af-b44200069ada"
    - secretKey: broker-kian-coffee-secret
      remoteRef:
        key: "50f80e1d-7ee1-41db-a475-b44200069b30"
    - secretKey: broker-master-secret
      remoteRef:
        key: "4ef12996-5e93-4a52-aa69-b44200069b95"

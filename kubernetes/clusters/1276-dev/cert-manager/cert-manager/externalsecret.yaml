apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token-secret
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  data:
  - secretKey: api-token
    remoteRef:
      key: "def165b7-f3ed-4502-873b-b502001fdc4f"  # dev/cloudflare/dns-api-token

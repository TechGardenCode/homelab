# DDoS floor only. Per-app rate limiting is the job of each HTTPRoute's
# own BackendTrafficPolicy (generic-service chart default since 43d5410).
# Cloudflare sits in front of this gateway and provides the primary
# edge protection; this policy is backstop-only.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: public-rate-limit
  namespace: envoy-gateway-system
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: eg-public
  rateLimit:
    type: Local
    local:
      rules:
        - limit:
            requests: 10000
            unit: Minute
          clientSelectors:
            - sourceCIDR:
                value: 0.0.0.0/0
                type: Distinct
  # Gateway-level compression safety net. Only applies to routes that do
  # NOT have their own BackendTrafficPolicy — a route-level policy
  # replaces this one wholesale rather than merging with it. Chart apps
  # carry their own policy and get compression from the generic-service
  # chart instead; this covers everything else (keycloak, argocd, etc).
  #
  # Merged into the rate-limit policy deliberately: Envoy Gateway allows
  # only ONE BackendTrafficPolicy per Gateway, a second is rejected
  # Conflicted.
  compressor:
    - type: Brotli
      brotli: {}
      minContentLength: 1024
    - type: Gzip
      gzip: {}
      minContentLength: 1024
